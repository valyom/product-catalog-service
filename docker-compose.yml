services:

  db:
    image: postgres:17

    container_name: product-catalog-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - product_catalog_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DB_USER} -d ${DB_NAME}"
      ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .

    container_name: product-catalog-web

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  product_catalog_postgres_data: