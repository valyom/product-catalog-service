version: "3.9"

services:

  db:
    image: postgres:17

    container_name: ebag-product-catalog-db

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - ebag_product_catalog_postgres_data:/var/lib/postgresql/data

volumes:
  ebag_product_catalog_postgres_data: